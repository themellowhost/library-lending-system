services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - JWT_SECRET=super-secret-production-library-key
      - DATABASE_PATH=/app/data/library.db
    volumes:
      - library_db_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  library_db_data:
